server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets can be cached for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}